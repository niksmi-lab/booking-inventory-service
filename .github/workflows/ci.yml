name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, vet and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/stock_test?sslmode=disable
      COMPOSE_PROJECT_NAME: booking-ci-${{ github.run_id }}
      POSTGRES_PASSWORD: ci-only-postgres-password
      API_KEY: ci-only-service-key-0123456789abcdef
      ADMIN_API_KEY: ci-only-admin-key-0123456789abcdef

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run static analysis
        run: go vet ./...

      - name: Scan for known vulnerabilities
        uses: golang/govulncheck-action@v1.1.0
        with:
          repo-checkout: false
          go-version-input: "1.25.x"
          go-package: ./...

      - name: Run tests with race detector and coverage
        run: go test -race -count=1 -cover ./internal/config ./internal/handlers ./internal/service ./internal/storage

      - name: Build binary
        run: go build -trimpath -o /tmp/booking-inventory-service ./cmd

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start container stack
        run: docker compose up --detach --build --wait

      - name: Run HTTP smoke test
        run: ./scripts/smoke-test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop container stack
        if: always()
        run: docker compose down --volumes --remove-orphans
